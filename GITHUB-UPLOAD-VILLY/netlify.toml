[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "SITE_TIMEZONE,TRUST_PROXY,NEXT_PUBLIC_SITE_URL,BOOKING_NOTIFICATION_EMAIL,RESEND_FROM_EMAIL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
